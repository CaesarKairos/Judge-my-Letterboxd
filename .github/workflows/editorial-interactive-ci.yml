name: Editorial interactive CI
on:
  push:
    branches: [feat/editorial-interactive-challenges]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Prompt sync and Node tests
        run: npm run test:web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke and edge cases
        shell: bash
        run: |
          python -m http.server 8080 --bind 127.0.0.1 > /tmp/judge-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && break
            sleep 0.5
          done
          npm run test:browser
          node web-tests/edge-cases.mjs
